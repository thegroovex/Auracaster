# XcodeGen spec – generate the Xcode project with:  cd macos && xcodegen generate
name: Auracaster
options:
  bundleIdPrefix: de.groovex
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Auracaster:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Auracaster
      # Python engine helper, copied into Contents/Resources of the app bundle.
      - path: ../engine/auracaster_helper.py
        buildPhase: resources
      # One-click engine setup (uv → Python 3.12 venv → Bumble + LC3), run by the app.
      - path: ../engine/setup-engine.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Auracaster
        PRODUCT_BUNDLE_IDENTIFIER: de.groovex.Auracaster
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Auracaster/Info.plist
      properties:
        CFBundleDisplayName: Auracaster
        CFBundleName: Auracaster
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Groove X. Bumble © Google LLC (Apache-2.0)."
        NSAudioCaptureUsageDescription: Auracaster nimmt das Systemaudio bzw. einzelne Apps auf, um es als Auracast-Broadcast zu senden.
        NSMicrophoneUsageDescription: Auracaster kann Mikrofone und Audio-Interfaces als Quelle für den Broadcast verwenden.
    entitlements:
      path: Auracaster/Auracaster.entitlements
      properties:
        # Not sandboxed (yet): the app launches a Python helper that opens the
        # USB HCI dongle via libusb. Revisit with an XPC/helper-tool design.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.device.usb: true
schemes:
  Auracaster:
    build:
      targets:
        Auracaster: all
    run:
      config: Debug
    archive:
      config: Release

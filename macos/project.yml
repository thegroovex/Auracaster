# XcodeGen spec – generate the Xcode project with:  cd macos && xcodegen generate
name: Auracaster
options:
  bundleIdPrefix: de.groovex
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Auracaster:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Auracaster
      # Python engine helper, copied into Contents/Resources of the app bundle.
      - path: ../engine/auracaster_helper.py
        buildPhase: resources
      # One-click engine setup (uv → Python 3.12 venv → Bumble + LC3), run by the app.
      - path: ../engine/setup-engine.sh
        buildPhase: resources
      # Dongle/repeater UF2 files for the dongle assistant (offline install).
      # CI fills BundledFirmware/Firmware before the build; copied as Resources/Firmware.
      - path: BundledFirmware/Firmware
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Auracaster
        PRODUCT_BUNDLE_IDENTIFIER: de.groovex.Auracaster
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Auracaster/Info.plist
      properties:
        CFBundleDisplayName: Auracaster
        CFBundleName: Auracaster
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Groove X. Bumble © Google LLC (Apache-2.0)."
        NSAudioCaptureUsageDescription: Auracaster nimmt das Systemaudio bzw. einzelne Apps auf, um es als Auracast-Broadcast zu senden.
        NSMicrophoneUsageDescription: Auracaster kann Mikrofone und Audio-Interfaces als Quelle für den Broadcast verwenden.
        NSRemovableVolumesUsageDescription: Der Dongle-Assistent schreibt die Auracaster-Firmware auf das Bootloader-Laufwerk des Boards (z. B. NICENANO).
    entitlements:
      path: Auracaster/Auracaster.entitlements
      properties:
        # Not sandboxed (yet): the app launches a Python helper that opens the
        # USB HCI dongle via libusb. Revisit with an XPC/helper-tool design.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.device.usb: true
  # Unit tests of the pure logic (dongle assistant, versions, capture plan).
  # The sources are compiled into the bundle directly: no host app.
  AuracasterTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: AuracasterTests
      - path: Auracaster/Firmware/FirmwareCore.swift
      - path: Auracaster/Update/UpdateService.swift
      - path: Auracaster/Audio/CapturePlan.swift
      - path: Auracaster/Model/LatencyParameters.swift
      - path: Auracaster/Model/BroadcastCode.swift
      - path: Auracaster/Model/BroadcastURI.swift
      - path: Auracaster/Model/AdaptiveBuffer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.groovex.AuracasterTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  AuracasterTests:
    build:
      targets:
        AuracasterTests: [test]
    test:
      targets:
        - AuracasterTests
  Auracaster:
    build:
      targets:
        Auracaster: all
    run:
      config: Debug
    archive:
      config: Release

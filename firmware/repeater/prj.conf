# Auracaster Repeater - standalone Auracast relay on a Pro Micro nRF52840
#
# Zephyr host + Zephyr open-source controller (LL_SW_SPLIT) on the same chip:
#   PA sync + BIG sync (ISO sync receiver)  ->  own EA + PA + BIG (ISO broadcaster)
# LC3 SDUs are forwarded byte-for-byte (no codec on the chip).

# --- System ----------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
# DTR + baud rate of the USB console: 1200 baud touch -> UF2 bootloader,
# "@AURA" status lines for the Mac app (src/host_link.c)
CONFIG_UART_LINE_CTRL=y
CONFIG_EVENTS=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- USB CDC ACM log console (board default backend) -----------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_UART=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Auracaster"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Auracaster Repeater"
# Own PID so the macOS helper never mistakes the repeater for the dongle
CONFIG_CDC_ACM_SERIAL_PID=0x0005

# --- Bluetooth host -----------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Auracaster Repeater"
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_PER_ADV=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_PER_ADV_SYNC_MAX=1
# Reassemble fragmented EA / PA reports in the host
CONFIG_BT_EXT_SCAN_BUF_SIZE=255
CONFIG_BT_PER_ADV_SYNC_BUF_SIZE=255

CONFIG_BT_ISO_SYNC_RECEIVER=y
CONFIG_BT_ISO_BROADCASTER=y
# one BIG received + one BIG sent, 2 BIS each
CONFIG_BT_ISO_MAX_BIG=2
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_ISO_TX_MTU=251
CONFIG_BT_ISO_RX_MTU=251
CONFIG_BT_ISO_TX_BUF_COUNT=16
CONFIG_BT_ISO_RX_BUF_COUNT=16
# A source with BN 5 (Auracaster default preset) delivers 5 SDUs per BIS at once

CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
# SDUs are forwarded from the RX callback
CONFIG_BT_RX_STACK_SIZE=2560

# --- Zephyr open-source link layer -------------------------------------------
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_PERIODIC=y
CONFIG_BT_CTLR_SYNC_PERIODIC=y
CONFIG_BT_CTLR_ADV_SET=2
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=255

# ISO broadcaster (relay BIG) ...
CONFIG_BT_CTLR_ADV_ISO=y
CONFIG_BT_CTLR_ADV_ISO_SET=1
CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=2
CONFIG_BT_CTLR_ADV_ISO_PDU_LEN_MAX=251
CONFIG_BT_CTLR_ISOAL_SOURCES=2
CONFIG_BT_CTLR_ISO_TX_BUFFERS=16
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=251
CONFIG_BT_CTLR_ISO_TX_SDU_LEN_MAX=251

# ... and ISO synchronized receiver (source BIG) in the same controller.
# Kconfig has no mutual exclusion between BT_CTLR_ADV_ISO and
# BT_CTLR_SYNC_ISO (see README, "Gleichzeitig empfangen und senden").
CONFIG_BT_CTLR_SYNC_ISO=y
CONFIG_BT_CTLR_SCAN_SYNC_ISO_SET=1
CONFIG_BT_CTLR_SYNC_ISO_STREAM_MAX=2
CONFIG_BT_CTLR_SYNC_ISO_PDU_LEN_MAX=251
CONFIG_BT_CTLR_ISOAL_SINKS=2
CONFIG_BT_CTLR_ISO_RX_BUFFERS=16

# Auracaster dongle - Zephyr Bluetooth LE controller for Bumble
#
# Transport: HCI H4 over USB CDC ACM (virtual serial port). The Zephyr USB
# HCI class (hci_usb) only moves commands, events and ACL; it has no ISO data
# path, so LE Audio broadcast needs H4 over CDC ACM, which carries ISO (0x05).
# Bumble opens it as  serial:/dev/cu.usbmodem<...>

# --- System / console off (the CDC ACM port is the HCI link) -------------
CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# DTR from the host drives the status LED
CONFIG_UART_LINE_CTRL=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=1024

# --- USB device (CDC ACM serial backend, enabled at boot by the board) ---
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Auracaster"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Auracaster Dongle"

# --- HCI raw, H4 framing --------------------------------------------------
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y

# Host-side buffer pools of the raw HCI layer (must match controller)
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_BUF_ACL_RX_SIZE=255

# --- Roles ----------------------------------------------------------------
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_PER_ADV=y

# --- ISO broadcaster (BIG/BIS) -------------------------------------------
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_ISO_MAX_BIG=1
CONFIG_BT_ISO_MAX_CHAN=2
# HCI ISO data from the host: up to 251 byte payload per packet.
# LC3 48 kHz / 10 ms is 100 (48_2), 120 (48_4) or 155 (48_6) octets per SDU.
CONFIG_BT_ISO_TX_MTU=251
CONFIG_BT_ISO_TX_BUF_COUNT=16

# --- Zephyr open-source link layer (LL_SW_SPLIT) -------------------------
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_BT_HCI_VS_FATAL_ERROR=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_RX_BUFFERS=6

# Maximum TX power of the nRF52840
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Extended + periodic advertising (Auracast: EA with Broadcast ID/name,
# PA carrying the BASE)
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_PERIODIC=y
CONFIG_BT_CTLR_ADV_SET=2
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
CONFIG_BT_CTLR_ADV_AUX_SET=2
CONFIG_BT_CTLR_ADV_SYNC_SET=2
# Advertising data buffers shared by all sets. The default (2) is exhausted
# when a second set is created before the first one is fully removed, which
# showed up as MEMORY_CAPACITY_EXCEEDED on LE Set Periodic Advertising
# Parameters after a preset change (v0.1.0) and then wedged the controller.
CONFIG_BT_CTLR_ADV_DATA_BUF_MAX=4
# v0.1.2: reserve radio time for the advertising data actually set (not the
# 191-byte maximum). EA/PA then steal less airtime from the BIG; v0.1.1 with
# 2 BIS x 120 B x RTN 4 got only ~60 of 200 SDUs/s confirmed.
CONFIG_BT_CTLR_ADV_RESERVE_MAX=n

# Broadcast Isochronous Group: 1 BIG with up to 2 BIS (stereo L/R)
CONFIG_BT_CTLR_ADV_ISO=y
CONFIG_BT_CTLR_ADV_ISO_SET=1
CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=2
CONFIG_BT_CTLR_ADV_ISO_STREAM_COUNT=2
CONFIG_BT_CTLR_ADV_ISO_PDU_LEN_MAX=251
CONFIG_BT_CTLR_ADV_ISO_SEQUENTIAL=y
CONFIG_BT_CTLR_ADV_ISO_INTERLEAVED=y

# ISO TX path in the controller (ISO-AL sources = BIS count)
CONFIG_BT_CTLR_ISOAL_SOURCES=2
CONFIG_BT_CTLR_ISO_TX_BUFFERS=16
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=251
CONFIG_BT_CTLR_ISO_TX_SDU_LEN_MAX=251
# Late SDUs go to the NEXT BIS event instead of being numbered strictly by the
# host's packet sequence number. With strict numbering a single late SDU
# (USB/host hiccup) left every following SDU "in the past" -> dropped ->
# choppy audio. Non-strict: payload = max(next in sequence, current event).
CONFIG_BT_CTLR_ISOAL_SN_STRICT=n

# --- Robustness -----------------------------------------------------------
# Controller assert / fatal error -> warm reboot instead of halting forever
# (the USB CDC link cannot carry the HCI error event with interrupts locked,
# so a halted dongle looked "hung until replug"). Also reboot when the host
# closes the serial port, so every helper start gets a clean controller.
CONFIG_REBOOT=y
